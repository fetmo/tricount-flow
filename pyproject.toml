[project]
name = "tricount-flow"
version = "0.1.0"
description = "Laptop-first CLI + local web UI to add expenses and view balances on a Tricount, via the unofficial Tricount/bunq API."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Moritz Jung" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["tricount", "bunq", "expenses", "cli", "expense-splitting", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Utilities",
]
dependencies = [
    "tricount-api==0.1.2",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/fetmo/tricount-flow"
Repository = "https://github.com/fetmo/tricount-flow"
Issues = "https://github.com/fetmo/tricount-flow/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
tricount = "tricount_flow.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer uses function calls in argument defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
